spring:
  application:
    name: location-service
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
    # Exécute les appels Feign protégés dans le thread de la requête :
    # le contexte de trace (Zipkin) est ainsi propagé vers les services appelés.
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true
info:
  app:
    name: DriveEasy Location Service
    version: 1.0.0
resilience4j:
  circuitbreaker:
    instances:
      driveEasyClients:
        sliding-window-size: 10
        failure-rate-threshold: 50
